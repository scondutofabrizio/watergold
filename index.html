#plmap{height:480px;border-radius:10px;isolation:isolate;z-index:0;background:#f2efe9}
.mlab{position:absolute;white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none;color:#4a4a4a;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.mlab-via{font:11px system-ui,sans-serif;color:#555}
.mlab-quar{font:600 12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:#6d6257}
.mlab-town{font:700 14px system-ui,sans-serif;color:#3a3a3a}
.leaflet-popup-content{font:13px system-ui,sans-serif;color:#1c2633}
@media (max-width:760px){#plmap{height:380px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--bg:#f3f5f8;--card:#fff;--text:#1c2633;--muted:#6b7785;--line:#e1e6ee;--brand:#0b7bc1;--ok:#2e9e5b;--warn:#d89b00;--danger:#d64541;--side:#0f2b40}
body{margin:0;font-family:system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
.app{display:flex;min-height:100vh}
.side{width:220px;background:var(--side);color:#fff;padding:18px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:10px}
.brand{font-weight:700;font-size:20px;margin:0 8px;color:#e3b64b}
.who{margin:0 8px;font-size:13px;color:#cfe0ef;background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px}
.who b{font-size:15px;color:#fff}
.who-ic{margin-right:6px}
.who-m{display:none}
.mhead .who-m{display:block;font-size:13px;font-weight:700;color:#fff;margin:0}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{background:none;color:#cfe0ef;text-align:left;padding:9px 12px;border-radius:8px;font-size:14px}
.nav button.on,.nav button:hover{background:rgba(255,255,255,.12);color:#fff}
.logout{margin-top:auto}
.muted-l{font-size:11px;color:#8fa6ba;margin:0 8px}
main{flex:1;padding:24px;min-width:0}
h2{margin:0 0 6px;font-size:24px}
h3{margin:0 0 10px;font-size:17px}
.sec-head{margin-bottom:14px}
.desc{margin:0;color:var(--muted);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn{background:var(--btn,var(--brand));color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
button:disabled{opacity:.5;cursor:default}
button.ghost,.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
button.danger{background:var(--danger)}
button.ok{background:var(--ok)}
button.sm{padding:5px 9px;font-size:13px}
button.big{padding:14px;font-size:16px;width:100%}
/* niente zoom con il doppio tocco su telefono e tablet (resta lo zoom con due dita) */
html,body,button,a,input,select,textarea,label{touch-action:manipulation}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);max-width:100%}
textarea{width:100%;min-height:70px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 .full{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi span{display:block;color:var(--muted);font-size:13px}
.kpi b{font-size:22px}
.kpi.warn{border-color:var(--warn)}
.muted{color:var(--muted)}
.small{font-size:12px}
.empty{padding:10px 0}
.r{text-align:right}
.acts{white-space:nowrap}
.acts button{margin-left:4px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#e8edf3;color:#334}
.badge.completato{background:#dff3e7;color:#18703f}
.badge.programmato{background:#e1effa;color:#0b5a8f}
.badge.in_corso{background:#fff1cc;color:#8a6100}
.badge.annullato{background:#fde2e1;color:#a52a27}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:120px}
.colh{display:flex;justify-content:space-between;border-left:4px solid;padding-left:8px;margin-bottom:10px}
.appt{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fbfcfe}
.appt .at{margin-bottom:4px}
.note{font-size:13px;color:var(--muted);font-style:italic;margin-top:4px}
.interv{font-size:13px;font-weight:600;margin-top:4px}
.importo{font-size:13px;font-weight:600;margin-top:4px;color:#0b6b2f}
.guasto{font-size:13px;margin-top:4px;padding:6px 8px;border-radius:6px;background:#fdecea;color:#8a1f17}
.row-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.row-acts select{padding:4px}
.rowline{padding:8px 0;border-bottom:1px solid var(--line)}
.todo{padding-left:0;list-style:none;margin:0}
.todo li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.mat-row{display:flex;gap:6px;margin-bottom:6px}
.mat-row select{flex:1}
.mat-row input{width:80px}
.giro{background:var(--card);border:1px solid var(--line);border-left:5px solid;border-radius:12px;padding:14px;margin-bottom:12px}
.giro .time{font-size:20px;font-weight:700}
.giro .links{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.giro .links a{font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;color:var(--brand);text-decoration:none;background:#fff}
.giro .stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bars{display:flex;gap:10px;align-items:flex-end;height:230px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar{width:100%;background:var(--brand);border-radius:6px 6px 0 0;min-height:2px}
.scan{border:2px solid var(--brand);border-radius:12px;padding:14px;margin-bottom:14px;background:#f4fafe}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;width:min(400px,100%);display:flex;flex-direction:column;gap:12px}
.login-box .brand{color:var(--side);margin:0;font-size:26px}
.err{color:var(--danger);margin:0}
.hint{background:#f4f6f9;border-radius:8px;padding:10px;font-size:13px;color:var(--muted)}
.tt-row{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tt-row:last-of-type{border-bottom:0}
.tt-name{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tt-name small{margin-left:auto}
.tt-name .dot{width:12px;height:12px;border-radius:50%;flex:none}
.tt-boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tt-box{border:1px solid;border-left-width:4px;border-radius:8px;padding:6px 10px;display:flex;align-items:baseline;gap:8px}
.tt-box b{font-size:22px}
.tt-box span{font-size:13px;color:var(--muted)}
.tt-bar{height:6px;background:var(--soft,#eef2f6);border-radius:99px;margin-top:8px;overflow:hidden}
.tt-bar i{display:block;height:100%;background:#2e9e5b}
@media (max-width:520px){.tt-box{flex-direction:column;gap:0;align-items:flex-start}}
.daynav{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.daynav input{flex:1 1 auto;min-width:0}
.daynav button{flex:0 0 auto;padding-left:12px;padding-right:12px}
.ac{position:relative;display:flex;gap:6px}
.ac input{flex:1}
.ac-drop{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:12;background:var(--card,#fff);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);max-height:280px;overflow:auto}
.ac-drop div{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-weight:400}
.ac-drop div:hover,.ac-drop div.on{background:var(--soft,#f4f6f9)}
.ac-drop .muted{cursor:default}
#modal{position:fixed;inset:0;background:rgba(10,20,30,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.open{display:flex}
#modal-box{background:#fff;border-radius:14px;width:min(680px,100%);max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h3{margin:0}
.mb{padding:18px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.qr-card{text-align:center}
#qr-box{display:flex;justify-content:center;margin-bottom:12px}
#req-fab{position:fixed;right:18px;bottom:18px;z-index:8;background:#e3b64b;color:#0f2b40;font-weight:700;border-radius:99px;padding:12px 18px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#req-fab:hover{filter:brightness(1.05)}
.req{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.req .ans{margin-top:8px;padding:8px 10px;border-left:3px solid var(--brand);background:var(--soft);border-radius:6px;font-size:14px}
@media (max-width:760px){#req-fab{bottom:82px;right:12px;padding:10px 14px;font-size:14px}}
@media print{#req-fab{display:none}}
@media (max-width:760px){
  .app{flex-direction:column}
  .side{width:100%;padding:10px}
  .nav{flex-direction:row;overflow-x:auto}
  .nav button{white-space:nowrap}
  .logout{margin-top:0}
  .grid2{grid-template-columns:1fr}
  main{padding:16px}
}

async function downloadFile(name, type, content){
  await dlReady;
  const blob = content instanceof Blob ? content : new Blob([content], {type});
  if (dlApi) {
    try { await dlApi.save({filename: name, data: blob}); }
    catch (e) {
      if (e && e.code === 'rate_limited') alert('C\'è già una richiesta di salvataggio aperta: confermala o chiudila e riprova.');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);

  setTimeout(() => URL.revokeObjectURL(a.href), 10000);

// Lettore CSV che rispetta le virgolette e rileva il separatore (; oppure ,)
function parseCsv(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const sep = first.split(';').length >= first.split(',').length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch !== '\r') cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}

}

  'borgo nuovo':'Palermo', 'brancaccio':'Palermo', 'villagrazia':'Palermo', 'bonagia':'Palermo', 'cruillas':'Palermo', 'zen':'Palermo',
  'aspra':'Bagheria', 'porticello':'Santa Flavia', "sant elia":'Santa Flavia', 'tonnarella':'Mazara del Vallo', 'tre fontane':'Campobello di Mazara',
  'torretta granitola':'Campobello di Mazara', 'triscina':'Castelvetrano', 'selinunte':'Castelvetrano', 'marinella di selinunte':'Castelvetrano',
  'villaggio mose':'Agrigento', 'san leone':'Agrigento', 'mortelle':'Messina', 'ganzirri':'Messina', 'giardini':'Giardini-Naxos', 'acitrezza':'Aci Castello',
  'aci trezza':'Aci Castello', 'ognina':'Catania', 'marina di ragusa':'Ragusa', 'mazzaro':'Taormina', 'capo d orlando marina':"Capo d'Orlando",
  'tre fontane di campobello':'Campobello di Mazara', 'piana degli albanesi':'Piana degli Albanesi'};
const normC = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/\(.*?\)/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();
const SANTI = /^(s|san|santa|santo|sant|ss)\s+/;
let comuniIdx = null;
// Trova il comune anche scritto in modo diverso: "Mazara", "S. Flavia", "Paterno", "Palermo (PA)", "Mondello"
function findComune(city){
  const q = normC(city);
  if (!q) return null;
  if (!comuniIdx) comuniIdx = new Map(COMUNI.map(c => [normC(c[0]), c]));
  const byName = n => comuniIdx.get(normC(n));
  if (comuniIdx.has(q)) return comuniIdx.get(q);
  if (LOCALITA[q]) return byName(LOCALITA[q]);
  const parts = q.split(' ');
  // "Palermo PA" o "Bagheria 90011": si toglie l'ultima parola se è una sigla di provincia o un CAP
  if (parts.length > 1 && /^([a-z]{2}|\d{5})$/.test(parts[parts.length - 1])) { const r = findComune(parts.slice(0, -1).join(' ')); if (r) return r; }
  const uno = list => list.length === 1 ? list[0] : null;
  if (SANTI.test(q)) { const resto = q.replace(SANTI, ''); const r = uno(COMUNI.filter(c => SANTI.test(normC(c[0])) && normC(c[0]).replace(SANTI, '') === resto)); if (r) return r; }
  if (q.length >= 4) return uno(COMUNI.filter(c => normC(c[0]).startsWith(q + ' ') || normC(c[0]).startsWith(q)));
  return null;
}
// Coordinate indicative di un comune (per i clienti nuovi senza posizione)
function geoGuess(city){
  const t = findComune(city) || TOWNS.find(x => x[0].toLowerCase() === String(city || '').trim().toLowerCase());
  if (!t) return null;
  return {lat: round6(t[1] + (Math.random() - .5) * .01), lng: round6(t[2] + (Math.random() - .5) * .01)};
}

// I dati inseriti dalla cliente non si azzerano mai con gli aggiornamenti: la chiave KEY resta 'watergold-v6'
// e ai dati già salvati si aggiungono solo i campi nuovi che mancano. Quando si aggiunge un campo, va elencato qui.
const DB_FIELDS = ['users','clients','items','appointments','invoices','movements','sentWa','reminders','log','lastDaily','plan'];
const SETTINGS_FIELDS = ['company','vat','address','site','vatRate','regime','sdi','pec','depot','services','rules','waTemplate','reminderTpl','confirmTpl','tipiIntervento'];
function upgrade(d){
  let fresh = null;
  const def = () => fresh || (fresh = seed());
  DB_FIELDS.forEach(k => { if (d[k] === undefined) d[k] = def()[k]; });
  d.settings = d.settings || {};
  SETTINGS_FIELDS.forEach(k => { if (d.settings[k] === undefined) d.settings[k] = def().settings[k]; });
  RULES.forEach(([k]) => { if (d.settings.rules[k] === undefined) d.settings.rules[k] = true; });
  return d;
}
function load(){
  if (SERVER) return srvCache() || emptyDb();
  try { const s = localStorage.getItem(KEY); if (s) return upgrade(JSON.parse(s)); } catch(e) {}
  return seed();
}
// Chiede al browser di non cancellare i dati salvati (es. Safari dopo giorni di inattività)
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
function save(){
  if (SERVER) { srvDirty = true; srvSaveCache(); srvSync(); return; }
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e) { alert('Memoria del browser piena: esporta un backup dalla sezione Dati e fogli.'); }
}

/* ---------- SERVER (prova con i dati veri sul PC di Watergold) ---------- */
// Aperto dal server (server/server.py) il gestionale usa accessi e dati del server, condivisi tra i dispositivi.
// La demo pubblica non cambia: senza server tutto resta nel browser sotto KEY.
// Sul dispositivo resta solo una copia per lavorare senza rete, sotto una chiave separata dalla demo.
const SERVER = !!window.WG_SERVER;
const SRV_KEY = 'watergold-server-v1';
const COLLS = ['users','clients','items','appointments','invoices','movements'];
const SINGLES = ['settings','sentWa','reminders','log','lastDaily','plan','v'];
let srvV = 0, srvSynced = {}, srvDirty = false, srvBusy = false, srvOnline = true, srvPw = {}, srvRender = false, srvCacheMe = null;
function emptyDb(){
  const s = seed().settings;
  return {v:6, users:[], clients:[], items:[], appointments:[], invoices:[], movements:[], sentWa:{}, reminders:{}, log:[], lastDaily:'', plan:null, settings:s};
}
// Dati del server nel formato del gestionale (i campi mancanti prendono i valori predefiniti, mai i dati demo)
function fromServer(d){
  const e = emptyDb();
  Object.keys(d || {}).forEach(k => { if (d[k] !== null && d[k] !== undefined) e[k] = d[k]; });
  return upgrade(e);
}
function srvSnap(d){
  const s = {};
  COLLS.forEach(c => (d[c] || []).forEach(r => { s[c + '|' + r.id] = JSON.stringify(r); }));
  SINGLES.forEach(k => { s['_|' + k] = JSON.stringify(d[k] === undefined ? null : d[k]); });
  return s;
}
function srvSet(raw, v){
  db = fromServer(raw);
  // la segreteria invia al server anche i valori predefiniti che lì mancano (es. impostazioni la prima volta)
  srvSynced = srvSnap(me && me.role === 'admin' ? raw : db);
  srvV = v;
}
function srvCache(){
  try {
    const c = JSON.parse(localStorage.getItem(SRV_KEY) || 'null');
    if (!c) return null;
    srvSynced = c.synced; srvV = c.v; srvDirty = true; srvCacheMe = c.me;
    return fromServer(c.db);
  } catch(e) { return null; }
}
function srvSaveCache(){
  if (!me) return;
  try { localStorage.setItem(SRV_KEY, JSON.stringify({db, synced: srvSynced, v: srvV, me: me.id})); } catch(e) {}
}
async function srvApi(path, body){
  // con campo debole una richiesta può restare appesa: dopo 30 secondi si considera fallita e si riprova
  const signal = AbortSignal.timeout ? AbortSignal.timeout(30000) : undefined;
  const r = await fetch(path, body === undefined ? {credentials:'same-origin', cache:'no-store', signal}
    : {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json', 'X-WG':'1'}, body: JSON.stringify(body), signal});
  if (r.status === 401) { const e = new Error('accesso'); e.auth = true; throw e; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.errore || ('errore ' + r.status)); e.attesa = !!j.attesa; throw e; }
  return j;
}

      srvWait = setTimeout(() => srvLogin(e, p, t0), 5000);

    }
    return showLogin(x.message === 'accesso' ? 'Email o password non corrette.' : x.message === 'Failed to fetch' ? 'Server non raggiungibile.'
      : x.attesa ? 'Il dispositivo non è ancora stato approvato: riprova più tardi.' : x.message);

function srvDiff(){
  const cambi = [], voci = {}, seen = new Set(), now = {};
  COLLS.forEach(c => (db[c] || []).forEach(r => {
    const k = c + '|' + r.id, j = JSON.stringify(r);
    seen.add(k); now[k] = j;
    if (srvSynced[k] !== j) cambi.push({c, id: r.id, data: r});
  }));
  Object.keys(srvSynced).forEach(k => {
    const [c, id] = k.split('|');
    if (c !== '_' && !seen.has(k)) { cambi.push({c, id, data: null}); now[k] = undefined; }
  });
  SINGLES.forEach(k => {
    const j = JSON.stringify(db[k] === undefined ? null : db[k]);
    now['_|' + k] = j;
    if (srvSynced['_|' + k] !== j) voci[k] = db[k] === undefined ? null : db[k];
  });
  return {cambi, voci, now};
}
async function srvSync(){
  if (!SERVER || !me || srvBusy || !srvDirty) return;
  srvBusy = true;
  try {
    const {cambi, voci, now} = srvDiff();
    const pw = srvPw;
    if (!cambi.length && !Object.keys(voci).length && !Object.keys(pw).length) { srvDirty = false; return; }
    srvDirty = false;
    const r = await srvApi('/api/sync', {cambi, voci, password: pw});
    srvPw = {};
    cambi.forEach(x => { const k = x.c + '|' + x.id; if (now[k] === undefined) delete srvSynced[k]; else srvSynced[k] = now[k]; });
    Object.keys(voci).forEach(k => { srvSynced['_|' + k] = now['_|' + k]; });
    if (r.tutto && !srvDirty) { srvSet(r.tutto, r.v); srvRender = true; }
    if (r.rifiutate && me.role === 'admin') alert(r.rifiutate + ' modifiche non sono state accettate dal server.');
    srvOnline = true;
    srvSaveCache();
  } catch(e) {
    srvDirty = true;
    if (e.auth) return srvLost();
    srvOnline = false;
  } finally { srvBusy = false; srvStatus(); }
}
// Aggiornamenti dagli altri dispositivi (ogni 3 secondi)
async function srvPoll(){
  if (!me) return;
  if (srvDirty) await srvSync();
  if (srvBusy || srvDirty) return srvStatus();
  try {
    const r = await srvApi('/api/changes?since=' + srvV);
    srvOnline = true;
    if (srvDirty || srvBusy) return;
    if (r.tutto) { srvSet(r.tutto, r.v); srvRender = true; }
    else if (r.cambi) {
      r.cambi.forEach(x => {
        const k = x.k ? '_|' + x.k : x.c + '|' + x.id;
        if (x.k) { db[x.k] = x.data === null && x.k === 'plan' ? null : (x.data ?? db[x.k]); srvSynced[k] = JSON.stringify(x.data); return; }
        const arr = db[x.c], i = arr.findIndex(o => o.id === x.id);
        if (x.data === null) { if (i >= 0) arr.splice(i, 1); delete srvSynced[k]; }
        else { if (i >= 0) arr[i] = x.data; else arr.push(x.data); srvSynced[k] = JSON.stringify(x.data); }
      });
      if (r.cambi.length) srvRender = true;
      srvV = r.v;
    } else srvV = r.v;
    if (srvRender) srvSaveCache();
  } catch(e) {
    if (e.auth) return srvLost();
    srvOnline = false;
  }
  srvStatus();
}
// Ridisegna solo quando nessuno sta scrivendo, così un aggiornamento non cancella un modulo a metà
function srvStatus(){
  const el = document.querySelector('.demo-note');
  if (el) el.textContent = srvOnline ? (srvDirty ? '🟡 Salvataggio in corso…' : '🟢 Collegato: dati condivisi e aggiornati')
    : '🔴 Senza rete: le modifiche restano sul dispositivo e si inviano appena torna la connessione';
  if (!srvRender || !me) return;
  const a = document.activeElement;
  if ($('#modal').classList.contains('open') || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) return;
  srvRender = false;
  me = db.users.find(u => u.id === me.id) || me;

}
function srvLost(){
  me = null;
  try { localStorage.removeItem(SRV_KEY); } catch(e) {}
  showLogin('Accesso scaduto: entra di nuovo.');
}
async function srvStart(){
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js'); } catch(e) {}
  try {
    const {user} = await srvApi('/api/me');
    if (!user) { try { localStorage.removeItem(SRV_KEY); } catch(e) {} return showLogin(); }
    me = user;
    if (srvCacheMe && srvCacheMe !== user.id) { srvSynced = {}; srvDirty = false; }   // copia di un altro utente: non si invia
    if (srvDirty) await srvSync();   // modifiche fatte senza rete prima di chiudere la pagina
    const r = await srvApi('/api/data');
    srvSet(r.db, r.v); srvDirty = false;
    srvSaveCache();
  } catch(e) {
    // senza rete: si riparte dalla copia sul dispositivo, se c'è
    let c = null;
    try { c = JSON.parse(localStorage.getItem(SRV_KEY) || 'null'); } catch(x) {}
    if (e.auth || !c) return showLogin(e.auth ? '' : 'Server non raggiungibile: controlla la connessione (Tailscale attivo).');
    srvOnline = false;
    me = db.users.find(u => u.id === c.me) || null;
    if (!me) return showLogin('Server non raggiungibile.');
  }
  enterApp();
  setInterval(srvPoll, 3000);
}

function pendingAppts(ym){

}
function completedIn(cid, ym){

// Importo scritto dalla segreteria (IVA inclusa): se c'è, è quello che va in fattura al posto di manodopera + materiali
const hasImporto = a => a.importo != null && a.importo !== '';
const nettoImporto = (a, rate = db.settings.vatRate) => round2(+a.importo / (1 + rate / 100));
function appTotal(a){
  if (hasImporto(a)) return nettoImporto(a);
  return round2(a.price + (a.materials || []).reduce((s,m) => { const it = byId(db.items, m.itemId); return s + (it ? it.price * m.qty : 0); }, 0));
}
const cname = id => (byId(db.clients, id) || {name:'—'}).name;
const tname = id => (byId(db.users, id) || {name:'—'}).name;
const cityOf = a => (byId(db.clients, a.clientId) || {city:''}).city;

// Scarica i materiali dal magazzino una sola volta, alla chiusura dell'intervento
function applyStock(a){
  if (a.status !== 'completato' || a.stockApplied || !db.settings.rules.scarico) return;
  (a.materials || []).forEach(m => moveStock(m.itemId, 'scarico', m.qty, `Intervento ${fmtDate(a.date)} - ${cname(a.clientId)}`, true));
  a.stockApplied = true;
}
// Movimento di magazzino (carico o scarico); con silent=true non fa commit
function moveStock(itemId, type, qty, note, silent = false){
  const it = byId(db.items, itemId);
  if (!it) return;
  const delta = type === 'carico' ? qty : -qty;
  it.qty = round2(it.qty + delta);
  db.movements.push({id:uid(), date:ymd(new Date()), itemId, qty:delta, type, note: note || ''});
  if (!silent) commit();
}
// Ricalcola il magazzino quando si cambiano i materiali di un intervento già scaricato
function adjustStock(a, oldMats, newMats){
  if (!a.stockApplied) return;
  const ids = new Set([...oldMats, ...newMats].map(m => m.itemId));
  ids.forEach(id => {
    const o = oldMats.filter(m => m.itemId === id).reduce((s,m) => s + m.qty, 0);
    const n = newMats.filter(m => m.itemId === id).reduce((s,m) => s + m.qty, 0);
    if (o !== n) moveStock(id, o > n ? 'carico' : 'scarico', Math.abs(o - n), 'Rettifica materiali intervento', true);
  });
}
function nextNumber(date, dbx = db){
  const y = date.slice(0,4);
  const max = dbx.invoices.filter(i => i.number.startsWith(y + '/')).reduce((m,i) => Math.max(m, +i.number.split('/')[1]), 0);
  return y + '/' + pad(max + 1, 4);
}
function createInvoice(cid, apps, date = ymd(new Date()), dbx = db, quiet = false){
  const lines = [], rate = dbx.settings.vatRate;
  let lordo = 0, nettoAltri = 0;
  apps.forEach(a => {
    if (hasImporto(a)) {
      const mats = (a.materials || []).map(m => { const it = byId(dbx.items, m.itemId); return it ? `${it.name} x${m.qty}` : ''; }).filter(Boolean);
      lines.push({desc:`${a.service} - ${fmtDate(a.date)}${a.address ? ' - ' + a.address : ''}${mats.length ? ' (materiali inclusi: ' + mats.join(', ') + ')' : ''}`, qty:1, price:nettoImporto(a, rate)});
      lordo += +a.importo;
      return;
    }
    const n0 = lines.length;
    lines.push({desc:`${a.service} - ${fmtDate(a.date)}${a.address ? ' - ' + a.address : ''}`, qty:1, price:a.price});
    (a.materials || []).forEach(m => {
      const it = byId(dbx.items, m.itemId);
      if (it) lines.push({desc:`Materiale: ${it.name}`, qty:m.qty, price:it.price});
    });
    nettoAltri += lines.slice(n0).reduce((s,l) => s + l.qty * l.price, 0);
  });
  const imponibile = round2(lines.reduce((s,l) => s + l.qty * l.price, 0));
  // Il totale rispetta al centesimo gli importi scritti (IVA inclusa)
  const inv = {id:uid(), number:nextNumber(date, dbx), date, clientId:cid, lines, imponibile, ivaRate:rate,
    totale:round2(lordo + nettoAltri * (1 + rate / 100)), status:'da incassare', apptIds:apps.map(a => a.id)};
  dbx.invoices.push(inv);
  return inv;
}
function reorderList(){
  return db.items.filter(i => i.qty <= i.min).map(i => ({...i, daOrdinare: Math.max(round2(i.min * 2 - i.qty), 1)}));
}

function genMonthlyVisits(ym){
  const techs = tecnici();
  if (!techs.length) return 0;
  const svc = db.settings.services.find(s => s.name === 'Visita contratto mensile') || db.settings.services[db.settings.services.length - 1];
  let n = 0;
  db.clients.filter(c => c.monthly).forEach((c, idx) => {
    if (db.appointments.some(a => a.clientId === c.id && monthOf(a.date) === ym && a.service === svc.name)) return;
    db.appointments.push({id:uid(), date:`${ym}-15`, time:'09:00', duration:60, clientId:c.id, techId:techs[idx % techs.length].id,
      service:svc.name, price:svc.price, address:c.address, notes:'Visita contratto mensile: da confermare con il cliente',
      status:'programmato', materials:[], stockApplied:false});
    n++;
  });
  return n;
}
// Crea le fatture per cliente degli interventi completati del mese; ritorna quante ne ha create
function autoInvoice(ym){
  const pend = pendingAppts(ym);
  if (!pend.length) return 0;
  const groups = {};
  pend.forEach(a => { (groups[a.clientId] = groups[a.clientId] || []).push(a); });
  const today = ymd(new Date());
  const date = ym === today.slice(0,7) ? today : lastDayOf(ym);
  Object.entries(groups).forEach(([cid, apps]) => createInvoice(cid, apps, date));
  return Object.keys(groups).length;
}
// Automazioni giornaliere: eseguite una volta al giorno all'accesso, oppure forzate dal pulsante
function runDaily(force){
  const today = ymd(new Date());
  if (!force && db.lastDaily === today) return;
  const r = db.settings.rules;
  const ym = today.slice(0,7);
  const prev = ymd(new Date(new Date().getFullYear(), new Date().getMonth() - 1, 1)).slice(0,7);
  if (r.visiteMensili) { const n = genMonthlyVisits(ym); if (n) logAct(`Create ${n} visite dei contratti per ${mesLabel(ym)}`); }
  if (r.fatturaMese) { const n = autoInvoice(prev); if (n) logAct(`Create ${n} fatture di ${mesLabel(prev)}`); }
  if (r.promemoria) { const n = db.appointments.filter(a => a.date === addDays(1) && a.status === 'programmato').length; if (n) logAct(`${n} promemoria pronti per domani`); }
  if (r.scorte) { const n = reorderList().length; if (n) logAct(`${n} articoli sotto scorta da riordinare`); }
  if (r.scaduti) { const lim = addDays(-30); const n = db.invoices.filter(i => i.status === 'da incassare' && i.date < lim).length; if (n) logAct(`${n} fatture non incassate da oltre 30 giorni`); }
  logAct('Automazioni giornaliere eseguite');
  db.lastDaily = today;
  save();
}

/* ---------- PIANIFICA GIRI (cambio filtri) ---------- */
// Distanze in linea d'aria corrette per la strada; tempi di guida più lenti in città
const hav = (a, b) => {
  const toR = x => x * Math.PI / 180;
  const dLa = toR(b.lat - a.lat), dLo = toR(b.lng - a.lng);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLo / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
};
const roadKm = (a, b) => hav(a, b) * 1.35;
const driveMin = km => km <= 4 ? km / 20 * 60 : 12 + (km - 4) / 55 * 60;
const fmtKm = km => km < 1 ? Math.max(50, Math.round(km * 20) * 50) + ' m' : km.toFixed(1).replace('.', ',') + ' km';
const minToT = m => { const r = Math.round(m); return pad(Math.floor(r / 60)) + ':' + pad(r % 60); };
const nextWorkday = s => { const d = new Date(s + 'T12:00:00'); do d.setDate(d.getDate() + 1); while (d.getDay() === 0 || d.getDay() === 6); return ymd(d); };
const CALL = {da_chiamare:['Da chiamare',''], confermato:['Confermato','completato'], non_risponde:['Non risponde','annullato'], rimanda:['Vuole rimandare','in_corso']};

}

  return db.clients.filter(c => c.prossimoCambio && c.lat && c.prossimoCambio <= end && (arretrati || c.prossimoCambio >= start) && !open.has(c.id));
}

// Divide i clienti in gruppi vicini tra loro, ognuno al massimo di "cap" interventi
function balancedClusters(pts, k, cap){
  if (k <= 1) return [pts.slice()];
  const mid = {lat: pts.reduce((s, p) => s + p.lat, 0) / pts.length, lng: pts.reduce((s, p) => s + p.lng, 0) / pts.length};
  let first = pts[0];
  pts.forEach(p => { if (hav(mid, p) > hav(mid, first)) first = p; });
  const centers = [{lat: first.lat, lng: first.lng}];
  while (centers.length < k) {
    let best = pts[0], bd = -1;
    pts.forEach(p => { const d = Math.min(...centers.map(c => hav(c, p))); if (d > bd) { bd = d; best = p; } });
    centers.push({lat: best.lat, lng: best.lng});
  }
  let groups = [];
  for (let it = 0; it < 15; it++) {
    groups = centers.map(() => []);
    // prima i clienti con la scelta più netta, poi gli altri dove c'è ancora posto
    pts.map(p => {
      const ds = centers.map(c => hav(c, p));
      const s = [...ds].sort((a, b) => a - b);
      return {p, ds, regret: (s[1] ?? 0) - s[0]};
    }).sort((a, b) => b.regret - a.regret).forEach(({p, ds}) => {
      const idx = ds.map((d, i) => i).sort((a, b) => ds[a] - ds[b]).find(i => groups[i].length < cap);
      groups[idx].push(p);
    });
    groups.forEach((g, i) => { if (g.length) centers[i] = {lat: g.reduce((s, p) => s + p.lat, 0) / g.length, lng: g.reduce((s, p) => s + p.lng, 0) / g.length}; });
  }
  return groups.filter(g => g.length);
}
// Percorso più corto: cliente più vicino via via, poi miglioramento a coppie (2-opt)
function orderRoute(list, start){
  const rest = list.slice(), out = [];
  let cur = start;
  while (rest.length) {
    let bi = 0;
    rest.forEach((p, i) => { if (hav(cur, p) < hav(cur, rest[bi])) bi = i; });
    cur = rest.splice(bi, 1)[0];
    out.push(cur);
  }
  const path = [start, ...out];
  let improved = true, guard = 0;
  while (improved && guard++ < 60) {
    improved = false;
    for (let i = 1; i < path.length - 1; i++) for (let j = i + 1; j < path.length; j++) {
      const a = path[i - 1], b = path[i], c = path[j], d = path[j + 1];
      if (hav(a, c) + (d ? hav(b, d) : 0) + 1e-9 < hav(a, b) + (d ? hav(c, d) : 0)) {
        path.splice(i, j - i + 1, ...path.slice(i, j + 1).reverse());
        improved = true;
      }
    }
  }
  return path.slice(1);
}
// Orari e chilometri di un giro; se la zona è lontana dalla sede si parte dal primo cliente
// Punto di partenza del giro: la sede (predefinito), un comune scelto o direttamente il primo cliente
function routeStart(r){
  if (r.start === 'primo') return null;
  if (r.start && r.start !== 'sede') { const t = findComune(r.start) || TOWNS.find(x => x[0] === r.start); if (t) return {lat: t[1], lng: t[2], label: t[0]}; }
  return db.settings.depot;
}
const stopDur = s => s.tipo === 'installazione' ? 90 : +db.plan.dur;
function routeInfo(r){
  const p = db.plan, st = routeStart(r);
  let t = toMin(p.start), km = 0, prev = st, remote = false;
  const rows = r.stops.filter(s => !isOut(s)).map((s, i) => {
    const c = byId(db.clients, s.cid);
    let leg = prev ? roadKm(prev, c) : 0;
    // con la partenza dalla sede, una zona a più di 30 km parte dal primo cliente
    if (i === 0 && prev && (!r.start || r.start === 'sede') && leg > 30) { remote = true; leg = 0; }
    t = Math.ceil((t + driveMin(leg)) / 5) * 5;
    km += leg;
    const row = {s, c, leg, eta: t};
    t += stopDur(s);
    prev = c;
    return row;
  });
  return {rows, km, end: t, remote, start: remote ? null : st};
}

  const r = db.plan.days[di].routes[ri];
  r.start = v;

}
function planGiri(){
  if (!requireAdmin()) return;

  if (!techs.length) return alert('Scegli almeno un tecnico.');

  const pts = daProgrammare(p.month, p.arretrati).filter(c => p.cities.includes(c.city));
  if (!pts.length) return alert('Nessun cliente da programmare con questi filtri.');
  if (db.plan && db.plan.days.some(d => d.routes.some(r => r.stops.some(s => s.call !== 'da_chiamare' && !s.apptId))) &&
    !confirm('Il piano attuale ha chiamate già registrate e non ancora messe in agenda. Sostituirlo con un nuovo calcolo?')) return;
  const cap = Math.max(1, +p.perTech || 9);
  const dep = db.settings.depot;
  const groups = balancedClusters(pts, Math.ceil(pts.length / cap), cap)
    .map(g => orderRoute(g, dep))
    // prima i gruppi con i clienti più in ritardo
    .sort((a, b) => a.reduce((m, c) => c.prossimoCambio < m ? c.prossimoCambio : m, '9999').localeCompare(b.reduce((m, c) => c.prossimoCambio < m ? c.prossimoCambio : m, '9999')));
  const days = [];
  let d = p.date;
  for (let i = 0; i < groups.length; i += techs.length) {
    days.push({date: d, routes: groups.slice(i, i + techs.length).map((g, j) => ({techId: techs[j].id, stops: g.map(c => ({cid: c.id, call: 'da_chiamare', tries: 0}))}))});
    d = nextWorkday(d);
  }
  db.plan = {created: new Date().toISOString(), month: p.month, arretrati: p.arretrati, cities: [...p.cities], start: p.start, dur: +p.dur || 30, days};
  ui.plDay = 0;
  ui.plView = null;
  logAct(`Giri calcolati: ${pts.length} clienti (${p.cities.join(', ')}) in ${days.length} giornate con ${techs.length} tecnici`);
  commit();
}
function plFind(di, ri, cid){ const r = db.plan.days[di].routes[ri]; return {r, s: r.stops.find(x => x.cid === cid)}; }
// Inserisce nel giro il cliente libero che allunga meno il percorso
// Il cliente libero che allunga meno il giro (solo proposta: decide l'operatrice)
function bestNearest(r, cands = plCandidates()){
  const act = r.stops.filter(s => !isOut(s)).map(s => byId(db.clients, s.cid));
  const ref = act.length ? act : [db.settings.depot];
  let best = null, bc = Infinity, bpos = 0;
  cands.forEach(c => {
    if (Math.min(...ref.map(x => hav(x, c))) > 6) return;
    for (let i = 0; i <= act.length; i++) {
      const a = act[i - 1], b = act[i];
      const cost = (a ? hav(a, c) : 0) + (b ? hav(c, b) : 0) - (a && b ? hav(a, b) : 0);
      if (cost < bc) { bc = cost; best = c; bpos = i; }
    }
  });
  return best ? {best, after: act[bpos - 1], extra: bc * 1.35} : null;
}
function replaceNearest(di, ri, silent){
  const r = db.plan.days[di].routes[ri];
  const cands = plCandidates();
  if (!cands.length) { if (!silent) alert('Non ci sono altri clienti da programmare in queste zone.'); return null; }
  const found = bestNearest(r, cands);
  if (!found) { if (!silent) alert('Nessun cliente da programmare entro 6 km da questo giro.'); return null; }
  const {best, after} = found;
  const idx = after ? r.stops.findIndex(s => s.cid === after.id) + 1 : 0;
  r.stops.splice(idx, 0, {cid: best.id, call: 'da_chiamare', tries: 0, added: true});
  return best;
}

// Simula l'esito di tutte le chiamate: chi non conferma viene sostituito dal cliente libero più vicino
function simulateCalls(){
  if (!db.plan) return;
  const tot = {conf: 0, nr: 0, rim: 0, sost: 0};
  for (let round = 0; round < 6; round++) {
    let any = false;
    db.plan.days.forEach((d, di) => d.routes.forEach((r, ri) => {
      r.stops.filter(s => s.call === 'da_chiamare' && !s.apptId).forEach(s => {
        any = true;
        const x = Math.random();
        s.call = x < 0.72 ? 'confermato' : x < 0.9 ? 'non_risponde' : 'rimanda';
        if (s.call === 'confermato') tot.conf++;
        else { s.tries = (s.tries || 0) + 1; s.call === 'rimanda' ? tot.rim++ : tot.nr++; if (ui.plAuto && replaceNearest(di, ri, true)) tot.sost++; }
      });
    }));
    if (!any) break;
  }
  logAct(`Chiamate simulate: ${tot.conf} confermati, ${tot.nr} non rispondono, ${tot.rim} rimandano, ${tot.sost} sostituiti con clienti vicini`);
  commit();
  alert(`Simulazione completata.\n\n✓ Confermati: ${tot.conf}\n✗ Non rispondono: ${tot.nr}\n↻ Vogliono rimandare: ${tot.rim}\n\n${ui.plAuto ? `Al loro posto il gestionale ha inserito ${tot.sost} clienti vicini e ha ricalcolato orari e percorsi.` : 'In ogni giro trovi la proposta del cliente libero più vicino: decidi tu se aggiungerlo.'}`);
}

// Inserisce la tappa nel punto del giro dove allunga meno il percorso
function insertBest(r, st){
  const c = byId(db.clients, st.cid);
  const act = r.stops.filter(s => !isOut(s));
  let best = act.length, bc = Infinity;
  for (let i = 0; i <= act.length; i++) {
    const a = act[i - 1] && byId(db.clients, act[i - 1].cid), b = act[i] && byId(db.clients, act[i].cid);
    const cost = (a ? hav(a, c) : 0) + (b ? hav(c, b) : 0) - (a && b ? hav(a, b) : 0);
    if (cost < bc) { bc = cost; best = i; }
  }
  const idx = best < act.length ? r.stops.indexOf(act[best]) : (act.length ? r.stops.indexOf(act[act.length - 1]) + 1 : 0);
  r.stops.splice(idx, 0, st);
}

function planMap(day){
  const routes = day.routes.map(r => ({r, info: routeInfo(r), t: byId(db.users, r.techId) || {color: '#888', name: '—'}}));
  const pts = routes.flatMap(x => x.info.rows.map(y => y.c));
  if (!pts.length) return '';
  const dep = db.settings.depot;
  const showDep = pts.some(p => hav(p, dep) < 30);
  const all = showDep ? pts.concat([dep]) : pts;
  let minLa = Math.min(...all.map(p => p.lat)), maxLa = Math.max(...all.map(p => p.lat));
  let minLo = Math.min(...all.map(p => p.lng)), maxLo = Math.max(...all.map(p => p.lng));
  const k = Math.cos(((minLa + maxLa) / 2) * Math.PI / 180);
  const padLa = (maxLa - minLa) * .08 + .002, padLo = (maxLo - minLo) * .08 + .002;
  minLa -= padLa; maxLa += padLa; minLo -= padLo; maxLo += padLo;
  const W = 800, H = 460, sc = Math.min(W / ((maxLo - minLo) * k), H / (maxLa - minLa));
  const offX = (W - (maxLo - minLo) * k * sc) / 2, offY = (H - (maxLa - minLa) * sc) / 2;
  const X = p => (offX + (p.lng - minLo) * k * sc).toFixed(1), Y = p => (offY + (maxLa - p.lat) * sc).toFixed(1);
  const free = plCandidates().filter(c => c.lat > minLa && c.lat < maxLa && c.lng > minLo && c.lng < maxLo);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--soft);border-radius:10px;display:block" role="img" aria-label="Mappa dei giri">
    ${free.map(c => `<circle cx="${X(c)}" cy="${Y(c)}" r="5" fill="var(--muted)" opacity=".5" style="cursor:pointer" onclick="mapPick(${ui.plDay},'${c.id}')"><title>${esc(c.name)} · ${esc(c.address)} (da programmare: tocca per aggiungerlo a un giro)</title></circle>`).join('')}
    ${routes.map(({info, t}) => {
      const path = (info.start && (info.start !== dep || showDep) ? [info.start] : []).concat(info.rows.map(y => y.c));
      return `<polyline points="${path.map(p => X(p) + ',' + Y(p)).join(' ')}" fill="none" stroke="${t.color}" stroke-width="2.5" stroke-linejoin="round" opacity=".85"/>` +
        info.rows.map((y, i) => `<g><circle cx="${X(y.c)}" cy="${Y(y.c)}" r="10" fill="${t.color}" stroke="#fff" stroke-width="1.5"/>
          <text x="${X(y.c)}" y="${Y(y.c)}" dy="3.5" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${i + 1}</text>
          <title>${esc(t.name)} · ${i + 1}. ${minToT(y.eta)} ${esc(y.c.name)} · ${esc(y.c.address)}</title></g>`).join('');
    }).join('')}
    ${showDep ? `<rect x="${+X(dep) - 8}" y="${+Y(dep) - 8}" width="16" height="16" rx="3" fill="#e3b64b" stroke="#0f2b40" stroke-width="1.5"><title>${esc(dep.label)}</title></rect>` : ''}
  </svg>
  <p class="muted small" style="margin:6px 0 0">${showDep ? '🟨 sede · ' : ''}cerchi numerati = ordine delle tappe per tecnico · puntini grigi = clienti liberi in zona (anche del mese dopo): toccali per aggiungerli</p>`;
}

function moveToRoute(di, ri, cid, to){

  const [dj, rj] = to.split('-').map(Number);
  const from = db.plan.days[di].routes[ri];
  const s = from.stops.find(x => x.cid === cid);
  from.stops = from.stops.filter(x => x !== s);
  db.plan.days[dj].routes[rj].stops.push(s);
  commit();

  day.routes.push({techId: t.id, stops: []});
  commit();
}

function applyFiltri(a){
  // dopo l'installazione parte il conteggio del primo cambio filtri
  if (a.service === 'Installazione depuratore' && a.status === 'completato') {
    const c = byId(db.clients, a.clientId);
    if (c && !c.prossimoCambio) { c.ultimoCambio = a.date; c.prossimoCambio = addMonths(a.date, c.filtroMesi || 6); }
    return;
  }
  if (a.service !== FILTRI || a.status !== 'completato') return;
  const c = byId(db.clients, a.clientId);
  if (!c || (c.ultimoCambio && c.ultimoCambio >= a.date)) return;
  c.ultimoCambio = a.date;
  c.prossimoCambio = addMonths(a.date, c.filtroMesi || 6);
}

// Mappa stradale disegnata dai dati OpenStreetMap del file mappa.json (strade, costa, nomi):
// non usa immagini esterne, così funziona anche nella pagina pubblicata. Senza il file resta la mappa schematica.
let plMapObj = null, baseData = null, baseLayers = null;
const baseReady = fetch('mappa.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { baseData = d; }).catch(() => { baseData = false; });
const ROAD = {m:['#e892a2', 6, 9], p:['#fcd6a4', 5, 10], s:['#f7fabf', 4.5, 11], t:['#ffffff', 4, 13], r:['#ffffff', 3, 14]};
function decodeLine(f){
  const out = [[f[0] / 1e5, f[1] / 1e5]];
  let la = f[0], lo = f[1];
  for (let i = 2; i < f.length; i += 2) { la += f[i]; lo += f[i + 1]; out.push([la / 1e5, lo / 1e5]); }
  return out;
}
function buildBase(){
  if (baseLayers || !baseData) return;
  const L1 = baseData.l, mk = (k, o) => L.polyline(L1[k].map(decodeLine), {pane: 'base', interactive: false, ...o});
  baseLayers = {c: mk('c', {color: '#8ab4d8', weight: 2.5})};
  ['r', 't', 's', 'p', 'm'].forEach(k => {
    const [col, w, z] = ROAD[k];
    baseLayers[k] = {z, lines: [mk(k, {color: '#c9c2b6', weight: w + 1.5}), mk(k, {color: col, weight: w})]};
  });
}
// Nomi di vie e quartieri: solo quelli visibili, in base allo zoom
function drawLabels(map, grp){
  grp.clearLayers();
  if (!baseData) return;
  const z = map.getZoom(), b = map.getBounds().pad(.1);
  const lab = (lat, lng, html, cls) => L.marker([lat, lng], {pane: 'labels', interactive: false,
    icon: L.divIcon({className: '', html: `<span class="mlab ${cls}">${esc(html)}</span>`, iconSize: [0, 0]})}).addTo(grp);
  baseData.pl.forEach(([n, la, lo, t]) => {
    const big = t === 'city' || t === 'town';
    if ((big && z <= 14) || (!big && z >= 13 && z <= 16 && t !== 'neighbourhood') || (t === 'neighbourhood' && z >= 15))
      if (b.contains([la, lo])) lab(la, lo, n, big ? 'mlab-town' : 'mlab-quar');
  });
  if (z >= 16) {
    let n = 0;
    for (const [nm, la, lo, c] of baseData.n) { if (n > 160) break; if (b.contains([la, lo])) { lab(la, lo, nm, 'mlab-via'); n++; } }
  }
}

function qrDataUrl(text){
  if (typeof QRCode === 'undefined') return '';
  const box = document.createElement('div');
  new QRCode(box, {text, width: 300, height: 300, colorDark: '#0f2b40', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M});
  const cv = box.querySelector('canvas');
  return cv ? cv.toDataURL('image/png') : '';
}

// Percorso Google Maps del tecnico: parte dalla sua posizione, al massimo 9 tappe per link (limite di Google)
function mapsGiro(rows){
  const pts = rows.filter(r => r.lat && r.lng).map(r => r.lat.toFixed(5) + ',' + r.lng.toFixed(5));
  const out = [];
  for (let i = 0; i < pts.length; i += 9) out.push('https://www.google.com/maps/dir/' + (i ? pts[i - 1] : '') + '/' + pts.slice(i, i + 9).join('/'));
  return out;
}
// Numero per WhatsApp: senza prefisso si aggiunge +39
function waNum(p){
  let d = digitsOf(p).replace(/^00/, '');
  if (d.length === 10 && d[0] === '3') d = '39' + d;
  return d;
}
// Messaggio WhatsApp al tecnico: elenco del giro e percorso Google Maps
function giroWa(techId, day, rows){
  rows = rows || [];
  if (!rows.length) return alert('Nessun intervento da inviare.');
  const t = byId(db.users, techId) || {};
  const links = mapsGiro(rows);
  const riga = (r, i) => [`*${i + 1}. ${r.ora}* ${r.cliente}`, `📍 ${[r.addr, r.city].filter(Boolean).join(', ')}`, r.tel ? `📞 ${r.tel}` : '',
    `🛠️ ${r.interv || '—'}${r.problema ? ` · guasto: ${r.problema}` : ''}${r.costo !== '' && r.costo != null ? ` · 💶 ${eur(r.costo)}` : ''}`].filter(Boolean).join('\n');
  const testo = [`*Giro di ${fmtLong(day)}* · ${rows.length} interventi`, ...rows.map(riga),
    links.length ? `🗺️ *Percorso su Google Maps*${links.length > 1 ? ` (in ${links.length} parti)` : ''}:\n` + links.map((u, i) => (links.length > 1 ? `${i + 1}ª parte: ` : '') + u).join('\n') : ''
  ].filter(Boolean).join('\n\n');
  const num = waNum(t.phone);
  if (!num) alert(`${t.name || 'Il tecnico'} non ha il numero di telefono (Impostazioni → Utenti): si apre WhatsApp e scegli tu a chi inviarlo.`);
  openExt(`https://wa.me/${num}?text=${encodeURIComponent(testo)}`);
}

  // Demo: posizione indicativa dal comune. Nella versione definitiva l'indirizzo viene convertito in coordinate esatte.
  const old = id ? byId(db.clients, id) : null;
  if (!old || !old.lat || old.city !== data.city) { const g = geoGuess(data.city); if (g) Object.assign(data, g, {zona: data.city}); }
  if (id) {
    const c = byId(db.clients, id);
    if (wa && !c.whatsappOk) data.consentDate = ymd(new Date());
    Object.assign(c, data);
  } else {
    const n = maxCode() + 1;
    db.clients.push({id:'c' + uid(), codice:'C' + pad(n, 5), ...data, consentDate: wa ? ymd(new Date()) : ''});
  }
  if (!data.lat && !(old && old.lat)) alert('Comune non presente nella demo: il cliente non apparirà sulla mappa dei giri.');
  closeModal();
  commit();
}

/* ---------- REPORT ---------- */
function viewReport(){
  const months = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); months.push(ymd(d).slice(0,7)); }
  const vals = months.map(m => db.invoices.filter(i => monthOf(i.date) === m).reduce((s,i) => s + i.imponibile, 0));
  const max = Math.max(1, ...vals);
  const bars = months.map((m,k) => `<div class="bar-col"><small class="muted">${eur(vals[k])}</small><div class="bar" style="height:${Math.round(vals[k] / max * 170)}px"></div><small>${MESI[+m.slice(5) - 1].slice(0,3)}</small></div>`).join('');
  const ym = ymd(new Date()).slice(0,7);

      if (c < 0 || r < 0) continue;
      const k = r * 1000 + c;
      if (!celle.has(k)) celle.set(k, []);
      celle.get(k).push(t);
    }
    for (let r = ys.length - 2; r >= 0; r--) {   // dall'alto (y più grande) in basso
      const riga = [];
      for (let c = 0; c < xs.length - 1; c++) {
        const ts = (celle.get(r * 1000 + c) || []).sort((a, b) => b.y - a.y || a.x - b.x);
        riga.push(ts.map(t => t.s.trim()).join(' ').replace(/\s+/g, ' ').trim());
      }
      if (riga.some(Boolean)) tutte.push(riga);
    }
  }

  // altre (es. COSTO e NOTE), con le stesse righe nello stesso ordine. Ogni riga di titoli apre una parte; le parti
  // con lo stesso numero di righe della parte principale si affiancano.
  const titolo = r => r.some(x => NOMI_COL.includes(normH(x))) || (r.some(Boolean) && r.filter(Boolean).every(x => PDF_TITOLI.has(normH(x))));

function parseDataIt(v){

    const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(+s) * 86400000);

  }

  if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/);

  if (m && +m[1] >= 1 && +m[1] <= 12) return `${m[2]}-${pad(+m[1])}-01`;
  m = s.toLowerCase().match(/^([a-z]{3})[a-z]*\.?[\s\/\-]*(\d{4})$/);   // NOVEMBRE 2026, nov-2026
  const mese = m ? ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'].indexOf(m[1]) : -1;
  if (mese >= 0) return `${m[2]}-${pad(mese + 1)}-01`;
  return '';
}

  const col = (...names) => { for (const n of names) { let i = H.indexOf(n); if (i < 0) i = H0.indexOf(n.replace(/_/g, '')); if (i >= 0 && !used.has(i)) { used.add(i); return i; } } return -1; };
  const ix = {codice:col('codice','codice_cliente','id'),
    name:col(...NOMI_COL), type:col('tipo','tipo_cliente'),
    phone:col('telefono','cellulare','tel','cell','recapito','telefono_cellulare','numero'), email:col('email','mail','e_mail'),
    address:col('indirizzo','via','indirizzo_impianto'), cap:col('cap'), city:col('citta','comune','localita','paese'),
    zona:col('zona','quartiere'), prov:col('provincia','prov'),
    vat:col('piva','p_iva','partita_iva','cf','codice_fiscale'), sdi:col('sdi','codice_sdi'),
    pec:col('pec'), monthly:col('mensile','contratto_mensile'), wa:col('consenso_whatsapp','whatsapp'), notes:col('note','annotazioni'),
    interv:col('intervento','tipo_intervento','impianto','tipo_impianto','tipo_di_intervento'),
    ultimo:col('ultima_manutenzione','ultima_manut','manutenzione','ultimo_cambio','ultimo_cambio_filtri','data_ultima_manutenzione','ultimo_intervento'),
    prossimo:col('manutenzione_programmata','manut_programmata','prossima_manut','prossimo_cambio','prossima_manutenzione','scadenza','prossimo_intervento','data_programmata'),
    mesi:col('filtri_ogni_mesi','mesi','frequenza','periodicita','frequenza_mesi'), costo:col('costo','importo','prezzo','canone','costo_intervento')};
  if (ix.name < 0) return alert('Colonna "nome" o "cliente" non trovata. Intestazioni lette: ' + H.join(', '));
  // le colonne che il gestionale non conosce non si perdono: restano nella scheda del cliente ("Altri dati dal file")
  const extraCols = rows[0].map((h, i) => ({h: String(h ?? '').trim(), i})).filter(x => x.h && !used.has(x.i));
  const plan = {upd:[], add:[], dup:[], err:0, merged:0, badDates:0, noGeo:0, cityFixed:0, extraCols: extraCols.map(x => x.h)};
  const phones = new Set(db.clients.map(c => digitsOf(c.phone)).filter(Boolean));
  const vats = new Set(db.clients.map(c => c.vat).filter(Boolean));
  const byCode = new Map(db.clients.map(c => [c.codice, c]));
  const inFile = new Map();   // stesso cliente su più righe del file (es. un intervento per riga): una sola scheda
  rows.slice(1).forEach(r => {
    const g = k => ix[k] >= 0 ? String(r[ix[k]] ?? '').trim() : '';
    const name = g('name');
    if (!name) { plan.err++; return; }
    const data = {name};
    const put = (k, key, v) => { if (ix[k] >= 0) data[key] = v === undefined ? g(k) : v; };
    put('type', 'type', /azienda/i.test(g('type')) ? 'azienda' : 'privato');
    ['phone','email','address','cap','city','zona','vat','sdi','pec','notes'].forEach(k => put(k, k));
    // Excel toglie lo 0 iniziale ai numeri fissi scritti come numero (091… → 91…): si rimette
    if (ix.phone >= 0 && typeof r[ix.phone] === 'number' && /^[1-9]\d{7,9}$/.test(data.phone) && data.phone[0] !== '3') data.phone = '0' + data.phone;
    put('prov', 'prov', g('prov').toUpperCase());
    put('monthly', 'monthly', yes(g('monthly')));
    put('wa', 'whatsappOk', yes(g('wa')));
    put('interv', 'tipoIntervento');
    put('costo', 'costo', parseEuro(r[ix.costo]));
    ['ultimo','prossimo'].forEach(k => {
      if (ix[k] < 0) return;
      const raw = r[ix[k]], d = parseDataIt(raw);
      if (String(raw ?? '').trim() && !d) plan.badDates++;
      data[k === 'ultimo' ? 'ultimoCambio' : 'prossimoCambio'] = d;
    });
    if (ix.mesi >= 0 && +g('mesi') > 0) data.filtroMesi = +g('mesi');
    const extra = {};
    // comune scritto in modo diverso ("Mazara", "S. Flavia", "Mondello"): si usa il nome ufficiale e la sua provincia,
    // e il testo originale resta tra gli altri dati
    const cm = ix.city >= 0 ? findComune(data.city) : null;
    if (cm) {
      if (normC(cm[0]) !== normC(data.city)) { extra['Città nel file'] = data.city; plan.cityFixed++; }
      data.city = cm[0];
      if (!data.prov) data.prov = cm[3];
    }
    if (ix.city >= 0 && !data.zona) data.zona = data.city;
    extraCols.forEach(x => { const v = r[x.i]; if (String(v ?? '').trim()) extra[x.h] = v instanceof Date ? ymd(v) : String(v).trim(); });
    if (Object.keys(extra).length) data.extra = extra;
    const ex = g('codice') ? byCode.get(g('codice')) : null;
    if (ex) { plan.upd.push({ex, data}); return; }
    const dig = digitsOf(data.phone);
    const key = name.toLowerCase().replace(/\s+/g, ' ') + '|' + dig;
    const prev = inFile.get(key);
    if (prev) {
      // righe dello stesso cliente: si tengono le date più recenti e i dati non vuoti
      ['ultimoCambio','prossimoCambio'].forEach(k => { if (data[k] && (!prev[k] || data[k] > prev[k])) prev[k] = data[k]; });
      Object.entries(data).forEach(([k, v]) => { if (!['ultimoCambio','prossimoCambio','extra'].includes(k) && v !== '' && v != null) prev[k] = v; });
      if (data.extra) prev.extra = {...(prev.extra || {}), ...data.extra};
      plan.merged++;
      return;
    }
    if ((dig && phones.has(dig)) || (data.vat && vats.has(data.vat))) { plan.dup.push(name); return; }
    if (dig) phones.add(dig);
    if (data.vat) vats.add(data.vat);
    inFile.set(key, data);
    plan.add.push(data);
  });
  plan.add.forEach(d => {
    if (!d.filtroMesi) d.filtroMesi = mesiTra(d.ultimoCambio, d.prossimoCambio) || 6;
    if (!d.prossimoCambio && d.ultimoCambio) d.prossimoCambio = addMonths(d.ultimoCambio, d.filtroMesi);
    if (!geoGuess(d.city)) plan.noGeo++;
  });
  pendingPlan = plan;
  const changed = plan.upd.filter(({ex, data}) => Object.keys(data).some(k => JSON.stringify(ex[k] ?? '') !== JSON.stringify(data[k] ?? ''))).length;
  modal('Anteprima importazione', `
    <ul class="stack small">
      <li><b>${changed}</b> clienti esistenti da aggiornare (su ${plan.upd.length} riconosciuti dal codice)</li>
      <li><b>${plan.add.length}</b> nuovi clienti da aggiungere</li>
      ${plan.merged ? `<li><b>${plan.merged}</b> righe dello stesso cliente unite in un'unica scheda (tenute le date più recenti)</li>` : ''}
      <li><b>${plan.dup.length}</b> duplicati saltati (telefono o P.IVA già presenti)${plan.dup.length ? ': ' + esc(plan.dup.slice(0,8).join(', ')) + (plan.dup.length > 8 ? '…' : '') : ''}</li>
      <li><b>${plan.err}</b> righe senza nome, ignorate</li>
      ${plan.badDates ? `<li>⚠️ <b>${plan.badDates}</b> date non riconosciute (lasciate vuote)</li>` : ''}
      ${plan.cityFixed ? `<li>🏘️ <b>${plan.cityFixed}</b> comuni scritti in modo diverso riportati al nome ufficiale (il testo originale resta nella scheda)</li>` : ''}
      ${plan.noGeo ? `<li>📍 <b>${plan.noGeo}</b> clienti con comune non riconosciuto o fuori dalla Sicilia: per ora senza posizione sulla mappa di Pianifica giri</li>` : ''}
      ${plan.extraCols.length ? `<li>Colonne conservate nella scheda del cliente: ${esc(plan.extraCols.join(', '))}</li>` : ''}
    </ul>
    <p class="muted small">Per i clienti già presenti si aggiornano solo le colonne presenti nel file. Le posizioni sulla mappa sono indicative (centro del comune). Controlla il file prima di confermare.</p>`,
    `<button class="ghost" onclick="pendingPlan=null;closeModal()">Annulla</button><button onclick="applyImport()">Conferma importazione</button>`);
}
function applyImport(){
  if (!pendingPlan || !requireAdmin()) return;
  const plan = pendingPlan;
  let upd = 0;
  plan.upd.forEach(({ex, data}) => {
    const before = JSON.stringify(ex);
    const {extra, ...rest} = data;
    Object.assign(ex, rest);
    if (extra) ex.extra = {...(ex.extra || {}), ...extra};
    if (data.whatsappOk && !ex.consentDate) ex.consentDate = ymd(new Date());
    if (JSON.stringify(ex) !== before) upd++;
  });
  let n = maxCode();
  plan.add.forEach(d => {
    n++;
    const geo = geoGuess(d.city);
    db.clients.push({id:'c' + uid(), codice:'C' + pad(n, 5), type:'privato', phone:'', email:'', address:'', cap:'', city:'', zona:'', prov:'',
      vat:'', sdi:'', pec:'', monthly:false, whatsappOk:false, notes:'', tipoIntervento:'', ultimoCambio:'', prossimoCambio:'',
      ...d, ...(geo ? {lat: geo.lat, lng: geo.lng, geoApprox: true} : {}), consentDate: d.whatsappOk ? ymd(new Date()) : ''});
  });
  logAct(`Import clienti: ${upd} aggiornati, ${plan.add.length} nuovi${plan.merged ? ', ' + plan.merged + ' righe unite' : ''}, ${plan.dup.length} duplicati saltati`);
  pendingPlan = null;
  closeModal();
  commit();
  alert(`Importazione completata: ${upd} aggiornati, ${plan.add.length} nuovi, ${plan.dup.length} duplicati saltati.`);
}

function makeQr(){
  const box = document.getElementById('qr-box');
  if (!box) return;
  const url = (document.getElementById('qr-url') || {}).value || db.settings.site;
  box.innerHTML = '';
  if (typeof QRCode === 'undefined') { box.innerHTML = '<p class="muted">Libreria QR non caricata: serve la connessione internet.</p>'; return; }
  new QRCode(box, {text:url, width:240, height:240, colorDark:'#0f2b40', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.H});
  document.getElementById('qr-label').textContent = url;
  if (url !== db.settings.site) { db.settings.site = url; save(); }
  if (db.settings.qrLogo === true) setTimeout(() => drawQrLogo(box), 60);
}
// Logo al centro del QR: quello caricato in questa sezione, altrimenti una goccia Watergold disegnata qui
function drawQrLogo(box){
  const cv = box.querySelector('canvas');
  if (!cv) return;
  const ctx = cv.getContext('2d'), W = cv.width, s = Math.round(W * 0.24), x = (W - s) / 2, pad = 5;
  const finish = () => { const img = box.querySelector('img'); if (img) img.src = cv.toDataURL('image/png'); };
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.roundRect(x - pad, x - pad, s + pad * 2, s + pad * 2, 10); ctx.fill();
  if (db.settings.logo) {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(s / im.width, s / im.height), w = im.width * k, h = im.height * k;
      ctx.drawImage(im, (W - w) / 2, (W - h) / 2, w, h);
      finish();
    };
    im.src = db.settings.logo;
    return;
  }
  const c = W / 2, r = s / 2;
  ctx.fillStyle = '#e3b64b';
  ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0f2b40';
  ctx.beginPath();
  ctx.moveTo(c, c - r * 0.62);
  ctx.bezierCurveTo(c + r * 0.15, c - r * 0.3, c + r * 0.45, c, c + r * 0.45, c + r * 0.2);
  ctx.arc(c, c + r * 0.2, r * 0.45, 0, Math.PI);
  ctx.bezierCurveTo(c - r * 0.45, c, c - r * 0.15, c - r * 0.3, c, c - r * 0.62);
  ctx.fill();
  finish();
}
function setQrLogo(input){
  const f = input.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    // ridimensiona il logo per non appesantire i dati salvati
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 200 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
      cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      db.settings.logo = cv.toDataURL('image/png');
      commit();
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
}
function saveQr(){
  const cv = document.querySelector('#qr-box canvas');
  if (!cv) return alert('Genera prima il QR code.');
  cv.toBlob(b => downloadFile('qr-watergold.png', 'image/png', b), 'image/png');
}

function saveUser(id){
  if (!requireAdmin()) return;
  const name = val('u-name').trim(), email = val('u-email').trim().toLowerCase(), role = val('u-role'), pass = val('u-pass');
  // con il server i tecnici entrano dal telefono collegato dalla segreteria: email e password servono solo alla segreteria
  const conAccesso = !SERVER || role === 'admin';
  if (!name || (conAccesso && !email)) return alert(conAccesso ? 'Nome ed email sono obbligatori.' : 'Il nome è obbligatorio.');
  if (email && db.users.some(u => u.email === email && u.id !== id)) return alert('Email già usata da un altro utente.');
  const minPw = SERVER ? 10 : 6;
  const diventaAdmin = SERVER && role === 'admin' && (!id || byId(db.users, id).role !== 'admin');
  if (diventaAdmin && !pass) return alert('Per un utente della segreteria servono email e password (almeno 10 caratteri).');
  if (((!id && conAccesso) || pass) && pass.length < minPw) return alert(`La password deve avere almeno ${minPw} caratteri.`);
  const data = {name, email, role, phone: val('u-phone').trim(), color: val('u-color')};
  // con il server la password va solo al server, che la conserva cifrata: mai nei dati condivisi
  if (id) {
    const u = byId(db.users, id);
    if (u.role === 'admin' && role !== 'admin' && db.users.filter(x => x.role === 'admin').length < 2) return alert('Deve restare almeno un utente titolare.');
    Object.assign(u, data);
    if (pass) { if (SERVER) srvPw[id] = pass; else u.pass = hashPw(pass); }
  } else {
    const nid = 'u' + uid();
    db.users.push(SERVER ? {id: nid, ...data} : {id: nid, ...data, pass:hashPw(pass)});
    if (SERVER && pass) srvPw[nid] = pass;

  closeModal();

// Link monouso (30 minuti) per collegare il telefono di un tecnico: QR da inquadrare o messaggio WhatsApp
async function collegaTelefono(id){
  if (!requireAdmin()) return;
  const u = byId(db.users, id);
  // un tecnico appena creato deve essere già sul server
  for (let i = 0; i < 20 && (srvBusy || srvDirty); i++) { await srvSync(); if (srvBusy || srvDirty) await new Promise(r => setTimeout(r, 300)); }
  if (srvDirty) return alert('Server non raggiungibile: riprova tra poco.');
  let r;
  try { r = await srvApi('/api/abbina', {userId: id}); }
  catch(e) { return alert('Link non creato: ' + e.message); }
  const d = digitsOf(u.phone), tel = d.length === 10 && d[0] === '3' ? '39' + d : d;
  const testo = `Ciao ${u.name.split(' ')[0]}, apri questo link dal tuo telefono e premi "Collega questo telefono" per entrare nel gestionale Watergold (vale ${r.minuti} minuti, una volta sola): ${r.link}`;
  modal('📱 Collega il telefono di ' + esc(u.name), `
    <p>Dal telefono del tecnico <b>inquadra il QR</b> con la fotocamera, oppure mandagli il link. Il link vale <b>${r.minuti} minuti</b> e <b>una volta sola</b>.</p>
    <div id="dev-qr" style="display:flex;justify-content:center;margin:12px 0"></div>
    <p class="small muted" style="word-break:break-all">${esc(r.link)}</p>
    <p class="small muted">Sul telefono si apre una pagina con il nome del tecnico e il pulsante "Collega questo telefono". Il telefono resta collegato un anno; lo puoi revocare quando vuoi da questa pagina.</p>`,
    `<button class="ghost" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(r.link))}).then(()=>alert('Link copiato.'))">Copia link</button>
     <button onclick="openExt('https://wa.me/${tel}?text=' + encodeURIComponent(${esc(JSON.stringify(testo))}))">Invia su WhatsApp</button>`);
  try { new QRCode(document.getElementById('dev-qr'), {text: r.link, width: 220, height: 220, colorDark: '#0f2b40', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M}); }
  catch(e) { document.getElementById('dev-qr').textContent = 'QR non disponibile: usa "Invia su WhatsApp" o "Copia link".'; }
}
async function caricaTelefoni(){
  const el = document.getElementById('dev-list');
  if (!el) return;
  try {
    const {dispositivi} = await srvApi('/api/dispositivi');
    const STATI = {ok: '🟢 collegato', revocato: '⛔ revocato', attesa: '⏳ in attesa', rifiutato: '⛔ rifiutato'};
    el.classList.remove('muted');
    el.innerHTML = dispositivi.length ? dispositivi.map(d => `<div class="rowline"><b>${esc(d.nome)}</b> · ${esc(d.descr || '')} · ${STATI[d.stato] || esc(d.stato)}
      <span class="muted">dal ${fmtStamp(d.creato)}</span> ${d.stato === 'ok' ? `<button class="danger sm" onclick="revocaTelefono(${d.n}, ${esc(JSON.stringify(d.nome))})">Revoca</button>` : ''}</div>`).join('')
      : '<p class="muted">Nessun telefono collegato.</p>';
  } catch(e) { el.textContent = 'Elenco non disponibile (' + e.message + ').'; }
}
async function revocaTelefono(n, nome){
  if (!confirm(`Revocare questo telefono di ${nome}? Uscirà subito; per rientrare servirà un nuovo collegamento.`)) return;
  try { await srvApi('/api/revoca', {n}); } catch(e) { return alert('Revoca non riuscita: ' + e.message); }
  caricaTelefoni();
}
function delUser(id){
  if (!requireAdmin()) return;
  const u = byId(db.users, id);
  if (u.id === me.id) return alert('Non puoi eliminare l\'utente con cui sei collegato.');
  if (u.role === 'admin' && db.users.filter(x => x.role === 'admin').length < 2) return alert('Deve restare almeno un utente titolare.');
  if (!confirm(`Eliminare l'utente ${u.name}?`)) return;
  db.users = db.users.filter(x => x.id !== id);
  commit();
}

// Invia la richiesta direttamente al Modulo Google, senza farlo riaprire e ricompilare.
// Se la pagina non può inviare da sola, mostra un unico pulsante che la invia con un tocco.
const SENT_KEY = 'watergold-richieste-inviate';
function sentList(){ try { return JSON.parse(localStorage.getItem(SENT_KEY) || '[]'); } catch(e) { return []; } }
function rememberSent(r){ try { localStorage.setItem(SENT_KEY, JSON.stringify([r, ...sentList()].slice(0, 50))); } catch(e) {} }
async function sendReq(){
  const sezione = val('rq-sec'), testo = val('rq-txt').trim(), nome = val('rq-nome').trim();
  if (!testo) return alert('Scrivi la richiesta.');
  const p = new URLSearchParams({[REQ_FORM.sezione]: sezione, [REQ_FORM.richiesta]: testo});
  if (REQ_FORM.nome) p.set(REQ_FORM.nome, nome);
  const action = REQ_FORM.url.replace(/viewform.*$/, 'formResponse');
  const rec = {data: ymd(new Date()), sezione, testo, nome};
  document.querySelector('#modal .mf button:last-child').disabled = true;
  try {
    await fetch(action, {method: 'POST', mode: 'no-cors', body: p});
    rememberSent(rec);
    modal('✅ Richiesta inviata', '<p style="margin-top:0">Grazie! La tua richiesta è arrivata. La trovi in <b>"Le tue richieste"</b> e lì vedrai anche la risposta quando sarà fatta.</p>',
      '<button onclick="closeModal();go(\'richieste\')">Vedi le tue richieste</button>');
  } catch (e) {
    const url = action + '?' + p.toString() + '&submit=Submit';
    modal('Ultimo passaggio', `<p style="margin-top:0">Tocca il pulsante qui sotto per inviare la richiesta. Si aprirà una pagina di Google con scritto <b>"La tua risposta è stata registrata"</b>: puoi chiuderla.</p>
      <p style="text-align:center"><a class="btn" style="padding:14px 22px;font-size:16px" href="${esc(url)}" target="_blank" rel="noopener" onclick="rememberSent(${esc(JSON.stringify(rec))});setTimeout(()=>{closeModal();go('richieste')},400)">📨 Invia la richiesta</a></p>`,
      '<button class="ghost" onclick="closeModal()">Annulla</button>');
  }
}

/* ---------- APERTURA LINK ESTERNI ---------- */
function openExt(url){
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/* ---------- TEMA, OROLOGIO, SALUTO ---------- */
const ICONS = {dash:'📊', pianifica:'🗺️', agenda:'📅', giro:'🛠️', clienti:'👥', magazzino:'📦', promemoria:'🔔', messaggi:'💬',
  fatture:'🧾', report:'📈', automazioni:'⚙️', dati:'🗂️', qr:'🔳', richieste:'📝', impost:'🔧'};
function applyTheme(){
  let t = 'light';
  try { t = localStorage.getItem('wg-theme') || 'light'; } catch(e) {}
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('.tlabel').forEach(el => { el.textContent = t === 'dark' ? 'Tema chiaro' : 'Tema scuro'; });
}
function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('wg-theme', next); } catch(e) {}
  applyTheme();
}
function updateClock(){
  const txt = new Date().toLocaleString('it-IT', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
  document.querySelectorAll('.clock').forEach(el => { el.textContent = txt; });
}
function saluto(){
  const h = new Date().getHours();
  return h < 12 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera';
}
